<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Mini Lavka — Daugavpils</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf9;--bg2:#f8f1e4;--card:#fff;--gold:#b8862b;--gold2:#8a5f12;--cream:#2a1a0c;--mut:#6f5d45;--red:#c8372d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:80px;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 46px)}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0;line-height:1.15}
.gold{background:linear-gradient(120deg,#8a5f12,#c9992f 50%,#8a5f12);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(255,253,249,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(184,134,43,.2)}
.nav{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream);font:700 20px 'Playfair Display',serif}
.brand img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold)}
nav{margin-left:auto;display:flex;gap:22px}nav a{color:var(--mut);text-decoration:none;font-size:14px;letter-spacing:.06em;text-transform:uppercase}nav a:hover{color:var(--gold2)}
.lang{display:flex;border:1px solid rgba(184,134,43,.4);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:6px 11px;font:600 12px Inter;cursor:pointer}.lang button.on{background:var(--gold);color:#1a1006}
.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;font:600 15px Inter;padding:14px 28px;border-radius:99px;background:linear-gradient(120deg,#c99a35,#f0d283,#c99a35);color:#1a1006;box-shadow:0 8px 28px rgba(184,134,43,.25);transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn.sm{padding:9px 18px;font-size:13px}.btn.ghost{background:none;color:var(--gold2);border:1px solid var(--gold);box-shadow:none}
.hero{background:radial-gradient(ellipse at 80% 20%,rgba(240,210,131,.35),transparent 60%);padding:64px 0 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.eyebrow{color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-size:12px;margin-bottom:14px}
.hero h1{font-size:clamp(40px,6vw,74px);font-weight:800}.hero p{color:var(--mut);font-size:18px;max-width:480px;margin:18px 0 28px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.frame{border-radius:22px;overflow:hidden;border:1px solid rgba(184,134,43,.45);box-shadow:0 26px 60px rgba(120,80,15,.2),0 0 0 8px rgba(184,134,43,.07)}.frame img{display:block;width:100%;height:auto}
.strip{display:flex;gap:28px;flex-wrap:wrap;padding:18px 0;border-block:1px solid rgba(184,134,43,.2);color:var(--mut);font-size:14px}.strip b{color:var(--gold2);font-weight:600}
section{padding:80px 0}h2{font-size:clamp(30px,4.5vw,46px);text-align:center;margin-bottom:10px}.sub{text-align:center;color:var(--mut);margin:0 auto 36px;max-width:560px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.tabs button{background:var(--card);color:var(--mut);border:1px solid rgba(184,134,43,.25);border-radius:99px;padding:10px 20px;font:500 14px Inter;cursor:pointer}.tabs button.on{background:var(--gold);color:#1a1006;border-color:var(--gold)}
.menu{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:30px;align-items:start;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid rgba(184,134,43,.3);border-radius:26px;padding:26px}
.menu .frame{box-shadow:none}.items{display:flex;flex-direction:column}
.it{display:flex;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px dashed rgba(184,134,43,.25)}.it:last-child{border:0}
.it h3{font:600 18px 'Playfair Display',serif;flex:none;max-width:70%}.it i{flex:1;border-bottom:1px dotted rgba(184,134,43,.35);min-width:12px}.it b{color:var(--gold2);font:700 18px 'Playfair Display',serif;white-space:nowrap}
.it small{display:block;color:var(--mut);font:400 13px/1.45 Inter;margin-top:3px;font-weight:400}.it div{flex:1;min-width:0}.row{display:flex;gap:12px;align-items:baseline}
.note{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}
.fav{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.fav figure{margin:0;position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(184,134,43,.25)}.fav img{width:100%;aspect-ratio:1;object-fit:cover;display:block;transition:.4s}.fav figure:hover img{transform:scale(1.07)}
.fav figcaption{position:absolute;inset:auto 0 0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font:600 15px 'Playfair Display',serif;color:#fff}
.about{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}.about h2{text-align:left}.about p{color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid rgba(184,134,43,.3);border-radius:20px;padding:26px;text-align:center}
.card h3{font-size:20px;color:var(--gold2);margin-bottom:8px}.card p{margin:0;color:var(--mut)}.card a{color:var(--cream);text-decoration:none;font-size:22px;font-weight:600}
footer{padding:30px 0 40px;border-top:1px solid rgba(184,134,43,.2);text-align:center;color:var(--mut);font-size:13px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}
.box{box-shadow:0 30px 80px rgba(0,0,0,.3);background:var(--card);border:1px solid var(--gold);border-radius:26px;padding:34px 28px;max-width:420px;width:100%;text-align:center;position:relative}
.box h3{font-size:28px;margin-bottom:6px}.box p{color:var(--mut);margin:0 0 22px;font-size:14px}.x{position:absolute;top:10px;right:16px;background:none;border:0;color:var(--mut);font-size:28px;cursor:pointer}
.app{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:12px;padding:17px;border:0;border-radius:16px;font:700 19px Inter;cursor:pointer;transition:.2s}.app:hover{transform:scale(1.03)}
.bolt{background:#34d186;color:#06281a}.wolt{background:#009de0;color:#fff}
.toast{color:#fff!important;background:#2a1a0c!important;position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--gold);color:#1a1006;padding:12px 22px;border-radius:99px;font-weight:600;font-size:14px;z-index:60;transition:.3s;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:820px){nav{display:none}.lang{margin-left:auto}.hero,.about,.menu{grid-template-columns:1fr}.hero{padding-top:36px}.cards{grid-template-columns:1fr}.fav{grid-template-columns:repeat(2,1fr)}section{padding:56px 0}.brand span{display:none}.btn.sm{padding:8px 14px}}
.badge{position:absolute;left:-14px;bottom:24px;background:#2a1a0c;color:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 14px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;line-height:1.2}.badge b{font:700 26px "Playfair Display",serif;color:#f0d283}.badge span{font-size:12px;opacity:.8}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:34px 0 0}.feat div{background:var(--card);border:1px solid rgba(184,134,43,.3);border-radius:18px;padding:18px 20px;display:flex;gap:12px;align-items:center;font-weight:600;box-shadow:0 8px 24px rgba(120,80,15,.07)}.feat span{font-size:26px}
.fab{display:none;position:fixed;z-index:30;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.reveal{opacity:0;transform:translateY(24px);transition:.7s}.reveal.in{opacity:1;transform:none}
@media(max-width:820px){.fab{display:block}.feat{grid-template-columns:1fr}.badge{left:10px;bottom:10px}}

.gold{background-size:200% auto;animation:sh 7s linear infinite}@keyframes sh{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.92) rotate(-2deg)}to{opacity:1;transform:none}}
@keyframes zoomi{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{box-shadow:0 14px 30px rgba(0,0,0,.25),0 0 0 0 rgba(240,210,131,.55)}50%{box-shadow:0 14px 30px rgba(0,0,0,.25),0 0 0 14px rgba(240,210,131,0)}}
@keyframes shine{0%,55%{left:-70%}100%{left:130%}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(24px)}to{opacity:1;transform:none}}
.hero>div:first-child>*{animation:rise .8s both}.hero>div:first-child>:nth-child(1){animation-delay:.1s}.hero>div:first-child>:nth-child(2){animation-delay:.25s}.hero>div:first-child>:nth-child(3){animation-delay:.4s}.hero>div:first-child>:nth-child(4){animation-delay:.55s}
.hero>div:last-child{animation:zoom 1.1s .2s both}.hero .frame{animation:float 6s ease-in-out 1.4s infinite}.badge{animation:pulse 2.6s infinite}
.btn{position:relative;overflow:hidden}.btn:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3.6s infinite}.btn.ghost:after{display:none}.btn.ghost:hover{background:var(--gold);color:#fff}
.pop{animation:rise .55s both;animation-delay:calc(var(--i)*60ms)}.fd{animation:zoomi .6s both}
.reveal.in .card,.reveal.in .feat>div,.feat.in>div{animation:rise .7s both}.cards .card:nth-child(2),.feat>div:nth-child(2){animation-delay:.12s!important}.cards .card:nth-child(3),.feat>div:nth-child(3){animation-delay:.24s!important}
.card,.feat>div{transition:.3s}.card:hover,.feat>div:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(120,80,15,.18)}
.card{display:flex;flex-direction:column;align-items:center}.card>p:last-child{margin-top:auto!important;padding-top:16px}
.strip{justify-content:space-between}.menu .frame{position:sticky;top:90px}.menu .frame img{aspect-ratio:4/3;object-fit:cover}
header .nav{transition:height .3s}header.s .nav{height:56px}header.s{box-shadow:0 6px 24px rgba(120,80,15,.12)}
nav a{position:relative}nav a:after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:.3s}nav a:hover:after{transform:scaleX(1)}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,#c99a35,#f0d283);transform:scaleX(0);transform-origin:left}
.modal .box{animation:pop .5s cubic-bezier(.2,1.3,.4,1)}.box h3{font-size:25px}
.logos{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lg{border:0;border-radius:22px;height:112px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:10px;transition:.3s cubic-bezier(.2,1.3,.4,1);animation:rise .6s .2s both;box-shadow:0 10px 26px rgba(0,0,0,.15)}.lg+.lg{animation-delay:.32s}.lg svg{width:100%;height:auto}.lg:hover{transform:translateY(-7px) scale(1.05);box-shadow:0 20px 40px rgba(0,0,0,.25)}.lg.wolt{background:#009de0}.lg.bolt{background:#34d186}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
.wrap{padding-inline:clamp(24px,6vw,48px)}
@media(max-width:820px){.wrap{padding-inline:30px}.nav{gap:8px}.menu{padding:24px 22px}.card{padding:28px 24px}.box{padding:34px 26px}.hero h1{font-size:44px}.hero p{font-size:17px}.strip{gap:10px 22px;padding:20px 0}.feat div{padding:16px 20px}.fav{gap:12px}.note{padding:0 6px}}
@media(min-width:1100px){.wrap{max-width:1280px;padding-inline:56px}.nav{height:78px;gap:30px}header.s .nav{height:62px}nav{gap:38px}nav a{font-size:15px}.brand{font-size:24px}.brand img{width:50px;height:50px}.hero{padding:110px 0 70px;gap:80px}.hero h1{font-size:clamp(70px,6.4vw,100px)}.hero p{font-size:21px;max-width:540px;margin:24px 0 34px}.eyebrow{font-size:13px}.btn{font-size:16px;padding:16px 34px}.btn.sm{padding:11px 22px;font-size:14px}.badge{left:-30px;bottom:40px;padding:16px 24px}.badge b{font-size:34px}.strip{font-size:16px;padding:24px 0}.feat{gap:24px;padding-top:56px}.feat>div{padding:24px 28px;font-size:18px}section{padding:130px 0}h2{font-size:clamp(44px,4vw,58px);margin-bottom:14px}.sub{font-size:18px;margin-bottom:56px;max-width:640px}.tabs{margin-bottom:44px}.tabs button{padding:12px 26px;font-size:15px}.menu{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:64px;padding:56px;border-radius:34px}.it{padding:18px 0}.it h3{font-size:22px}.it b{font-size:22px}.it small{font-size:14.5px}.fav{gap:24px}.fav figcaption{font-size:18px;padding:34px 18px 14px}.about{gap:96px}.about p{font-size:18px}.cards{gap:30px}.card{padding:40px 32px}.card h3{font-size:24px}.card a{font-size:26px}.card p{font-size:17px}.box{max-width:480px}.lg{height:130px}}
@media(max-width:820px){.menu .frame{position:static;top:auto}.menu .frame img{aspect-ratio:16/10}.row{align-items:flex-start}.it h3{max-width:none;flex:1;font-size:18px;line-height:1.25}.it i{display:none}.it b{padding-top:1px;font-size:18px}.it small{margin-top:5px}.tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin-inline:-30px;padding:2px 30px 10px;scrollbar-width:none;scroll-snap-type:x proximity}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;scroll-snap-align:center;transition:.3s}.tabs button.on{transform:scale(1.06);box-shadow:0 8px 20px rgba(184,134,43,.35)}}
@media(min-width:821px){.menu .frame{position:sticky;top:96px;align-self:start}}
.tabs button{transition:.3s}.tabs button:hover{transform:translateY(-2px)}.it{transition:.3s}.it:hover{padding-left:8px}
@keyframes fabin{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
.fab.btn{position:fixed;left:auto;top:auto;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;padding:15px 28px;box-shadow:0 12px 30px rgba(120,80,15,.38);animation:fabin .6s .8s both}
.modal.open~.fab{opacity:0;pointer-events:none;animation:none}
@media(max-width:820px){footer{padding-bottom:96px}}
